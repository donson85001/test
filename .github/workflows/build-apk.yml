name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
      - name: Report build failure
        if: failure() && steps.build_apk.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          { echo "Build failed for commit ${GITHUB_SHA}"; echo '~~~'; tail -n 160 build.log; echo '~~~'; } > failure.md
          gh issue create --title "Android APK build error ${GITHUB_RUN_NUMBER}" --body-file failure.md || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: delivery-decision-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
